<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1045" viewBox="0 0 1500 1045" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#666666"/>
    </marker>
    <marker id="arrd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#999999"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1000" fill="#ffffff"/>

  <!-- title -->
  <text x="50" y="48" font-size="20" font-weight="bold" fill="#333333">Claims Processing System — Technology Architecture</text>
  <text x="50" y="70" font-size="12" fill="#888888">Deployment view: every external service is env-activated with a tested in-process fallback</text>

  <!-- ============ Netlify container ============ -->
  <rect x="50" y="330" width="270" height="250" rx="6" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="65" y="352" font-size="12" font-weight="bold" fill="#666666">NETLIFY · static hosting</text>

  <rect x="75" y="380" width="220" height="120" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="185" y="410" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">React 19 Console</text>
  <text x="185" y="432" font-size="11" fill="#333333" text-anchor="middle">Vite 8 build · SSE live trace</text>
  <text x="185" y="450" font-size="11" fill="#333333" text-anchor="middle">react-markdown + mermaid</text>
  <text x="185" y="468" font-size="11" fill="#333333" text-anchor="middle">(docs rendered in-app)</text>

  <!-- browser -->
  <rect x="75" y="140" width="220" height="70" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="185" y="170" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Reviewer</text>
  <text x="185" y="190" font-size="11" fill="#333333" text-anchor="middle">Browser</text>

  <!-- browser -> console -->
  <path d="M185,210 L185,380" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="150" y="280" width="70" height="18" fill="#ffffff"/>
  <text x="185" y="293" font-size="11" fill="#666666" text-anchor="middle">HTTPS</text>

  <!-- ============ Render container ============ -->
  <rect x="430" y="110" width="460" height="740" rx="6" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="445" y="132" font-size="12" font-weight="bold" fill="#666666">RENDER · web service · Python 3.12</text>

  <!-- fastapi -->
  <rect x="460" y="155" width="400" height="80" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="660" y="185" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">FastAPI + Uvicorn</text>
  <text x="660" y="207" font-size="11" fill="#333333" text-anchor="middle">REST + Server-Sent Events · Pydantic v2 contracts · uploads</text>

  <!-- pipeline sub-container -->
  <rect x="460" y="265" width="400" height="560" rx="6" fill="#fafafa" stroke="#999999" stroke-width="1"/>
  <text x="660" y="290" font-size="12" font-weight="bold" fill="#666666" text-anchor="middle">Decision pipeline — typed TraceStep at every stage</text>

  <!-- pipeline stages -->
  <rect x="500" y="310" width="320" height="48" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="660" y="330" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">intake_validator</text>
  <text x="660" y="347" font-size="10.5" fill="#333333" text-anchor="middle">payload · roster · deadline · minimum</text>

  <rect x="500" y="382" width="320" height="48" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="660" y="402" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">document_verifier</text>
  <text x="660" y="419" font-size="10.5" fill="#333333" text-anchor="middle">required types · readability · same patient</text>

  <rect x="500" y="454" width="320" height="48" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="660" y="474" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">extraction_agent</text>
  <text x="660" y="491" font-size="10.5" fill="#333333" text-anchor="middle">GPT-4o vision → typed, validated JSON</text>

  <rect x="500" y="526" width="320" height="48" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="660" y="546" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">policy_retriever</text>
  <text x="660" y="563" font-size="10.5" fill="#333333" text-anchor="middle">policy_terms.json snapshot · graph cross-check</text>

  <rect x="500" y="598" width="320" height="48" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="660" y="618" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">adjudication_engine</text>
  <text x="660" y="635" font-size="10.5" fill="#333333" text-anchor="middle">pure Python · no LLM, no I/O · computes the money</text>

  <rect x="500" y="670" width="320" height="48" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="660" y="690" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">fraud_checker</text>
  <text x="660" y="707" font-size="10.5" fill="#333333" text-anchor="middle">velocity · same-day · high-value rules</text>

  <rect x="500" y="742" width="320" height="48" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="660" y="762" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">decision_synthesizer</text>
  <text x="660" y="779" font-size="10.5" fill="#333333" text-anchor="middle">decision + reasons + confidence rollup</text>

  <!-- pipeline chain arrows -->
  <path d="M660,235 L660,265" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M660,358 L660,382" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M660,430 L660,454" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M660,502 L660,526" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M660,574 L660,598" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M660,646 L660,670" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M660,718 L660,742" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- console -> fastapi -->
  <path d="M295,440 L375,440 L375,195 L460,195" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="330" y="300" width="90" height="18" fill="#ffffff"/>
  <text x="375" y="313" font-size="11" fill="#666666" text-anchor="middle">REST + SSE</text>

  <!-- ============ OpenAI ============ -->
  <rect x="1090" y="140" width="300" height="240" rx="6" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="1105" y="162" font-size="12" font-weight="bold" fill="#666666">OPENAI API</text>

  <rect x="1115" y="185" width="250" height="80" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="1240" y="215" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">GPT-4o</text>
  <text x="1240" y="237" font-size="11" fill="#333333" text-anchor="middle">document classification · vision extraction</text>

  <rect x="1115" y="285" width="250" height="70" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="1240" y="312" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">text-embedding-3-small</text>
  <text x="1240" y="332" font-size="11" fill="#333333" text-anchor="middle">policy-concept vectors</text>

  <!-- extraction -> gpt4o -->
  <path d="M820,478 L1000,478 L1000,225 L1115,225" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="835" y="452" width="150" height="18" fill="#ffffff"/>
  <text x="910" y="465" font-size="11" fill="#666666" text-anchor="middle">typed contracts + retry</text>

  <!-- ============ Stores ============ -->
  <rect x="430" y="880" width="960" height="105" rx="6" fill="none" stroke="#666666" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="445" y="902" font-size="12" font-weight="bold" fill="#666666">MANAGED STORES · each env-activated, each with an in-process fallback</text>

  <rect x="460" y="915" width="280" height="55" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="600" y="936" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">Neon Postgres</text>
  <text x="600" y="953" font-size="10.5" fill="#333333" text-anchor="middle">system of record · JSONB traces · psycopg</text>

  <rect x="770" y="915" width="280" height="55" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="910" y="936" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">Qdrant Cloud</text>
  <text x="910" y="953" font-size="10.5" fill="#333333" text-anchor="middle">semantic tier · paraphrase → exclusion candidates</text>

  <rect x="1080" y="915" width="280" height="55" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="1220" y="936" font-size="12.5" font-weight="bold" fill="#333333" text-anchor="middle">Neo4j AuraDB</text>
  <text x="1220" y="953" font-size="10.5" fill="#333333" text-anchor="middle">policy graph · rules · doc requirements · members</text>

  <!-- fallback notes -->
  <text x="600" y="1010" font-size="10.5" fill="#999999" text-anchor="middle" font-style="italic">fallback: SQLite</text>
  <text x="910" y="1010" font-size="10.5" fill="#999999" text-anchor="middle" font-style="italic">fallback: token matcher (−0.10 conf)</text>
  <text x="1220" y="1010" font-size="10.5" fill="#999999" text-anchor="middle" font-style="italic">fallback: in-memory snapshot (−0.05 conf)</text>

  <!-- synthesizer -> postgres -->
  <path d="M600,790 L600,915" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="530" y="845" width="140" height="18" fill="#ffffff"/>
  <text x="600" y="858" font-size="11" fill="#666666" text-anchor="middle">persist claim + trace</text>

  <!-- adjudication -> qdrant -->
  <path d="M820,622 L910,622 L910,915" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="835" y="700" width="150" height="18" fill="#ffffff"/>
  <text x="910" y="713" font-size="11" fill="#666666" text-anchor="middle">paraphrase candidates</text>

  <!-- policy_retriever -> neo4j -->
  <path d="M820,550 L1220,550 L1220,915" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="1140" y="700" width="160" height="18" fill="#ffffff"/>
  <text x="1220" y="713" font-size="11" fill="#666666" text-anchor="middle">graph lookups + cross-check</text>

  <!-- embeddings -> qdrant -->
  <path d="M1240,355 L1240,420 L1035,420 L1035,890 L960,890 L960,915" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrd)"/>
  <rect x="1060" y="590" width="90" height="18" fill="#ffffff" transform="translate(-95,0)"/>
  <text x="1010" y="603" font-size="11" fill="#999999" text-anchor="middle">embeddings</text>

  <!-- legend -->
  <rect x="50" y="640" width="270" height="130" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="65" y="663" font-size="12" font-weight="bold" fill="#666666">Legend</text>
  <path d="M65,685 L115,685" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="125" y="689" font-size="11" fill="#666666">request / data path</text>
  <path d="M65,710 L115,710" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrd)"/>
  <text x="125" y="714" font-size="11" fill="#666666">index build (offline)</text>
  <rect x="65" y="726" width="50" height="16" rx="3" fill="none" stroke="#666666" stroke-dasharray="6,4"/>
  <text x="125" y="738" font-size="11" fill="#666666">deployment boundary</text>
  <text x="65" y="762" font-size="10.5" fill="#999999" font-style="italic">LLM never decides money — the engine is pure Python</text>
</svg>
