[project]
name = "plum-claims"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "neo4j",
    "openai>=2.53.0",
    "psycopg[binary]",
    "pydantic>=2.7",
    "qdrant-client",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
